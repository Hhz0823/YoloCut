# Desktop release workflow. It only runs when manually dispatched.
# Run it against a branch to build native Actions artifacts, or against a v* tag
# to publish an installer-only GitHub Release (.exe and .dmg assets only).
# GitHub automatically adds source archives to every release.
name: desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --loglevel=error
        env:
          # onnxruntime-node@1.22.0 postinstall fails on ubuntu CI runners (NuGet
          # misses the win-x64 CUDA runtime). CI validates logic only, so skip it.
          ONNXRUNTIME_NODE_INSTALL: 'skip'
      - name: Install media test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - run: npm run lint
      - name: Ensure Remotion browser
        run: node -e "import('@remotion/renderer').then(m => m.ensureBrowser()).then(() => console.log('browser ready'))"
      - name: Run test suite
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum npm test
      - run: npm run verify:agent-skill
      - run: npm run build

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            script: desktop:dist
            artifact: |
              release/*.dmg
          - name: macOS-x64
            os: macos-15-intel
            script: desktop:dist:mac-x64
            artifact: |
              release/*.dmg
          - name: Windows-x64
            os: windows-latest
            script: desktop:dist:win
            artifact: |
              release/*.exe
          - name: Linux-x64
            os: ubuntu-latest
            script: desktop:dist:linux
            artifact: |
              release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --loglevel=error
        env:
          # onnxruntime-node@1.22.0 postinstall fails on linux CI runners; skip the
          # NuGet runtime download (real ORT bytes ship separately for packaging).
          ONNXRUNTIME_NODE_INSTALL: 'skip'

      # First write the browser version corresponding to Remotion, and then use desktop:dist
      # The prepare-target step puts the target platform browser and compositor into the installation package.
      - name: Ensure Remotion browser
        run: node -e "import('@remotion/renderer').then(m => m.ensureBrowser()).then(() => console.log('browser ready'))"

      - name: Verify Windows hardware encoders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx tsx desktop/remotion-binaries.verify.ts
          node remotion/direct-hardware.verify.mjs
          $ffmpeg = node -p "require('ffmpeg-static')"
          $encoders = & $ffmpeg -hide_banner -encoders 2>&1 | Out-String
          foreach ($encoder in @('h264_nvenc', 'h264_qsv', 'h264_amf')) {
            if ($encoders -notmatch [regex]::Escape($encoder)) {
              throw "Bundled FFmpeg is missing $encoder"
            }
          }

      - name: Package
        run: npm run ${{ matrix.script }}

      - name: Smoke test macOS distribution
        if: runner.os == 'macOS'
        shell: bash
        env:
          CC_SMOKE: '1'
          CC_SMOKE_RENDER: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          [[ "${#dmgs[@]}" -eq 1 ]]

          mount_dir="$(mktemp -d "$RUNNER_TEMP/yolocut-dmg.XXXXXX")"
          app_dir="$(mktemp -d "$RUNNER_TEMP/yolocut-app.XXXXXX")"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_dir" || hdiutil detach -force "$mount_dir"
            fi
            rm -rf "$mount_dir"
            rm -rf "$app_dir"
          }
          trap cleanup EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmgs[0]}"
          mounted=true
          mounted_app="$mount_dir/YoloCut.app"
          test -x "$mounted_app/Contents/MacOS/YoloCut"
          # Copy the mounted app to a writable temporary directory before executing it.
          ditto "$mounted_app" "$app_dir/YoloCut.app"
          hdiutil detach "$mount_dir"
          mounted=false

          copied_app="$app_dir/YoloCut.app"
          test -x "$copied_app/Contents/MacOS/YoloCut"
          test -x "$copied_app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          "$copied_app/Contents/MacOS/YoloCut"
          case "$(uname -m)" in
            arm64) runtime_arch='mac-arm64' ;;
            x86_64) runtime_arch='mac-x64' ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          render_runtime="YoloCut.app/Contents/Resources/chrome-headless-shell/$runtime_arch/chrome-headless-shell-$runtime_arch/chrome-headless-shell"
          test -x "$app_dir/$render_runtime"

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)"
          }
          ./scripts/smoke-yolocut-installer.ps1 `
            -Installer $installers[0].FullName

      - name: Smoke test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC_SMOKE: '1'
          CC_SMOKE_RENDER: '1'
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(release/*.AppImage)
          [[ "${#appimages[@]}" -eq 1 ]]
          chmod +x "${appimages[0]}"
          # Ubuntu runners do not expose FUSE, so execute the shipped AppImage through its runtime extraction path.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run --auto-servernum "${appimages[0]}" --appimage-extract-and-run

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-files
          merge-multiple: true

      - name: Stage installer-only release assets
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          test "$(find release-files -type f | wc -l | tr -d ' ')" = 4
          test -f "release-files/YoloCut-v${EXPECTED_VERSION}-x64.exe"
          test -f "release-files/YoloCut-v${EXPECTED_VERSION}-arm64.dmg"
          test -f "release-files/YoloCut-v${EXPECTED_VERSION}-x64.dmg"
          test -f "release-files/YoloCut-v${EXPECTED_VERSION}-x86_64.AppImage"

          mkdir release-assets
          cp "release-files/YoloCut-v${EXPECTED_VERSION}-x64.exe" release-assets/
          cp "release-files/YoloCut-v${EXPECTED_VERSION}-arm64.dmg" release-assets/
          cp "release-files/YoloCut-v${EXPECTED_VERSION}-x64.dmg" release-assets/
          test "$(find release-assets -type f | wc -l | tr -d ' ')" = 3
          test "$(find release-assets -type f ! \( -name '*.exe' -o -name '*.dmg' \) | wc -l | tr -d ' ')" = 0

          checksum_file="$RUNNER_TEMP/installer-checksums.txt"
          (cd release-assets && sha256sum ./*) | tee "$checksum_file"
          {
            echo '### Installer SHA-256'
            echo '```text'
            cat "$checksum_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or reuse draft release
        shell: bash
        run: |
          set -euo pipefail
          release_ready=false

          for attempt in {1..8}; do
            if is_draft="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' 2>/dev/null)"; then
              if [[ "$is_draft" != "true" ]]; then
                echo "Release $GITHUB_REF_NAME is already public; refusing to replace it" >&2
                exit 1
              fi
              release_ready=true
              break
            fi
            if gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --draft; then
              release_ready=true
              break
            fi
            if [[ "$attempt" == 8 ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          [[ "$release_ready" == "true" ]]

      - name: Remove non-installer release assets
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.id')"
          while IFS=$'\t' read -r asset_id asset_name; do
            case "$asset_name" in
              *.exe|*.dmg) ;;
              *) gh api --method DELETE \
                   "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" ;;
            esac
          done < <(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --paginate \
            --jq '.[] | [.id, .name] | @tsv')

      - name: Upload and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          uploaded=false

          for attempt in {1..8}; do
            if gh release upload "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber; then
              uploaded=true
              break
            fi
            if [[ "$attempt" == 8 ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          [[ "$uploaded" == "true" ]]

          local_manifest="$RUNNER_TEMP/local-release-assets.tsv"
          remote_manifest="$RUNNER_TEMP/remote-release-assets.tsv"
          : > "$local_manifest"
          for asset in release-assets/*; do
            digest="$(sha256sum "$asset" | cut -d ' ' -f1)"
            printf '%s\tsha256:%s\n' "${asset##*/}" "$digest" >> "$local_manifest"
          done
          LC_ALL=C sort -o "$local_manifest" "$local_manifest"

          verified=false
          for attempt in {1..8}; do
            if release_json="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets)"; then
              if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
                echo "Release $GITHUB_REF_NAME became public before asset verification" >&2
                exit 1
              fi
              jq -r '.assets[] | [.name, (.digest // "")] | @tsv' \
                <<<"$release_json" | LC_ALL=C sort > "$remote_manifest"
              if cmp -s "$local_manifest" "$remote_manifest"; then
                verified=true
                break
              fi
              echo "Release asset names or SHA-256 digests do not match local files" >&2
              diff -u "$local_manifest" "$remote_manifest" || true
            fi
            if [[ "$attempt" == 8 ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          [[ "$verified" == "true" ]]

      - name: Put installer checksums in release notes
        shell: bash
        run: |
          set -euo pipefail
          current_notes="$RUNNER_TEMP/current-release-notes.md"
          base_notes="$RUNNER_TEMP/base-release-notes.md"
          next_notes="$RUNNER_TEMP/next-release-notes.md"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > "$current_notes"
          awk '
            /<!-- yolocut-installer-checksums:start -->/ { skipping=1; next }
            /<!-- yolocut-installer-checksums:end -->/ { skipping=0; next }
            !skipping { print }
          ' "$current_notes" > "$base_notes"
          {
            cat "$base_notes"
            echo
            echo '<!-- yolocut-installer-checksums:start -->'
            echo '## Installer SHA-256'
            echo
            while read -r digest path; do
              printf -- '- `%s` — `%s`\n' "${path#./}" "$digest"
            done < "$RUNNER_TEMP/installer-checksums.txt"
            echo '<!-- yolocut-installer-checksums:end -->'
          } > "$next_notes"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$next_notes"

      - name: Publish verified draft
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $GITHUB_REF_NAME is already public; refusing to republish it" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
